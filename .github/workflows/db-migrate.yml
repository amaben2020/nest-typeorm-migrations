name: Sync TypeORM Schema on Merge

on:
  push:
    branches:
      - staging
      - main

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'Production' || 'Staging' }}

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🛠 Set NODE_ENV and create .env.{env}
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "NODE_ENV=production" >> $GITHUB_ENV
            ENV_FILE=".env.production"
            echo "DB_HOST=${{ secrets.PROD_DB_HOST }}" >> $ENV_FILE
            echo "DB_PORT=${{ secrets.PROD_DB_PORT }}" >> $ENV_FILE
            echo "DB_USERNAME=${{ secrets.PROD_DB_USERNAME }}" >> $ENV_FILE
            echo "DB_PASSWORD=${{ secrets.PROD_DB_PASSWORD }}" >> $ENV_FILE
            echo "DB_NAME=${{ secrets.PROD_DB_DATABASE }}" >> $ENV_FILE
          else
            echo "NODE_ENV=staging" >> $GITHUB_ENV
            ENV_FILE=".env.staging"
            echo "DB_HOST=${{ secrets.STAGING_DB_HOST }}" >> $ENV_FILE
            echo "DB_PORT=${{ secrets.STAGING_DB_PORT }}" >> $ENV_FILE
            echo "DB_USERNAME=${{ secrets.STAGING_DB_USERNAME }}" >> $ENV_FILE
            echo "DB_PASSWORD=${{ secrets.STAGING_DB_PASSWORD }}" >> $ENV_FILE
            echo "DB_NAME=${{ secrets.STAGING_DB_DATABASE }}" >> $ENV_FILE
          fi

      - name: 🧪 Build
        run: npm run build

      - name: 🚀 Run migrations
        run: npm run migration:run
