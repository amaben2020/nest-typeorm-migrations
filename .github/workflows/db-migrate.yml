name: Run Migrations

on:
  push:
    branches:
      - staging
      - main

jobs:
  migrations:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Set environment variables
        if: github.ref == 'refs/heads/main'
        run: |
          echo "NODE_ENV=production" >> $GITHUB_ENV
          echo "DB_HOST=${{ secrets.PROD_DB_HOST }}" >> $GITHUB_ENV
          echo "DB_PORT=${{ secrets.PROD_DB_PORT }}" >> $GITHUB_ENV
          echo "DB_USERNAME=${{ secrets.PROD_DB_USERNAME }}" >> $GITHUB_ENV
          echo "DB_PASSWORD=${{ secrets.PROD_DB_PASSWORD }}" >> $GITHUB_ENV
          echo "DB_DATABASE=${{ secrets.PROD_DB_DATABASE }}" >> $GITHUB_ENV

      - name: Set environment variables (staging)
        if: github.ref == 'refs/heads/staging'
        run: |
          echo "NODE_ENV=staging" >> $GITHUB_ENV
          echo "DB_HOST=${{ secrets.STAGING_DB_HOST }}" >> $GITHUB_ENV
          echo "DB_PORT=${{ secrets.STAGING_DB_PORT }}" >> $GITHUB_ENV
          echo "DB_USERNAME=${{ secrets.STAGING_DB_USERNAME }}" >> $GITHUB_ENV
          echo "DB_PASSWORD=${{ secrets.STAGING_DB_PASSWORD }}" >> $GITHUB_ENV
          echo "DB_DATABASE=${{ secrets.STAGING_DB_DATABASE }}" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm install

      - name: Verify environment variables
        run: |
          echo "DB_HOST: $DB_HOST"
          echo "DB_PORT: $DB_PORT"
          echo "DB_DATABASE: $DB_DATABASE"
          echo "NODE_ENV: $NODE_ENV"

      - name: Run migrations
        run: npm run migration:run
