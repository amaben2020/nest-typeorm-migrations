name: Sync TypeORM Schema on Merge

on:
  push:
    branches:
      - staging
      - main

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'Production' || 'Staging' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      # Set environment variables
      - run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "DB_HOST=${{ secrets.PROD_DB_HOST }}" >> $GITHUB_ENV
            echo "DB_PORT=${{ secrets.PROD_DB_PORT }}" >> $GITHUB_ENV
            echo "DB_USERNAME=${{ secrets.PROD_DB_USERNAME }}" >> $GITHUB_ENV
            echo "DB_PASSWORD=${{ secrets.PROD_DB_PASSWORD }}" >> $GITHUB_ENV
            echo "DB_DATABASE=${{ secrets.PROD_DB_DATABASE }}" >> $GITHUB_ENV
            touch .env.production
          else
            echo "DB_HOST=${{ secrets.STAGING_DB_HOST }}" >> $GITHUB_ENV
            echo "DB_PORT=${{ secrets.STAGING_DB_PORT }}" >> $GITHUB_ENV
            echo "DB_USERNAME=${{ secrets.STAGING_DB_USERNAME }}" >> $GITHUB_ENV
            echo "DB_PASSWORD=${{ secrets.STAGING_DB_PASSWORD }}" >> $GITHUB_ENV
            echo "DB_DATABASE=${{ secrets.STAGING_DB_DATABASE }}" >> $GITHUB_ENV
            touch .env.staging
          fi

      # - run: npm run build
      # - run: npm run migration:run
      # - run: npm run typeorm -- migration:show
      - run: npm run build

      - name: Run migrations (ignore duplicate index errors)
        run: |
          set +e
          OUTPUT=$(npm run migration:run 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "$OUTPUT" | grep -q 'Duplicate key name'
            if [ $? -eq 0 ]; then
              echo "⚠️ Migration failed due to duplicate index — safe to ignore."
            else
              echo "❌ Migration failed for another reason. Failing job."
              exit 1
            fi
          else
            echo "✅ Migrations applied successfully."
          fi

      - run: npm run typeorm -- migration:show
